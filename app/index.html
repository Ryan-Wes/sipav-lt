<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPAV LT — Sistema de Planejamento de Avanço</title>
  <link rel="icon" type="image/webp" href="img/favicon.webp">

  <!-- Tema antes da primeira pintura, senão pisca branco ao abrir -->
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('sipav_tema') || 'dark'; } catch (e) {}
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // "indigo" vira a escala do acento: as utilitárias que sobraram no JS
    // pintam com a cor certa sem precisar reescrever string.
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            indigo: {
              50:'#FFF7ED', 100:'#FFEDD5', 200:'#FED7AA', 300:'#FDBA74',
              400:'#FB923C', 500:'#F97316', 600:'#EA6A0C', 700:'#C2410C',
              800:'#9A3412', 900:'#7C2D12', 950:'#431407'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Lê e reescreve o .xlsx da ISA preservando fórmulas e formatação -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <!-- ?v= força o navegador a buscar de novo quando o código muda. -->
  <link rel="stylesheet" href="css/app.css?v=53">
</head>
<body class="h-full flex flex-col antialiased">

<!-- ========================================================================
     TELA DE LOGIN
     ===================================================================== -->
<div id="telaLogin" class="hidden fixed inset-0 z-50 items-center justify-center p-4"
     style="background:var(--fundo);background-image:var(--brilho)">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img id="logoLogin" alt="SIPAV LT" class="mx-auto mb-3"
           style="height:76px;width:auto">
      <p class="text-base" style="color:var(--texto-fraco)">Sistema de Planejamento de Avanço</p>
    </div>

    <form id="formLogin" class="painel p-6 space-y-4">
      <div>
        <label class="rotulo">E-mail</label>
        <input id="loginEmail" name="email" type="email" required
               autocomplete="username" autocapitalize="off" spellcheck="false"
               class="campo" placeholder="seu.nome@empresa.com">
      </div>
      <div>
        <label class="rotulo">Senha</label>
        <input id="loginSenha" name="password" type="password" required
               autocomplete="current-password"
               class="campo" placeholder="••••••••">
      </div>

      <p id="loginErro" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>

      <button id="btnEntrar" type="submit"
              class="btn-primario w-full flex items-center justify-center gap-2 disabled:opacity-60">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Entrar</span>
      </button>
    </form>

    <div class="flex items-center justify-center gap-3 mt-6">
      <p class="text-center text-xs" style="color:var(--texto-fraco)">LT Serra Dourada</p>
      <button onclick="SIPAV.app.alternarTema()" class="btn-tema" style="width:32px;height:32px"
              title="Alternar tema claro/escuro">
        <i data-lucide="sun-moon" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
</div>

<!-- ========================================================================
     CARREGANDO
     ===================================================================== -->
<div id="telaCarregando" class="fixed inset-0 z-40 flex items-center justify-center"
     style="background:var(--fundo)">
  <div class="text-center">
    <div class="w-10 h-10 rounded-full animate-spin mx-auto mb-3"
         style="border:3px solid var(--borda);border-top-color:var(--acento)"></div>
    <p class="text-sm" id="textoCarregando" style="color:var(--texto-suave)">Carregando…</p>
  </div>
</div>

<!-- ========================================================================
     APLICAÇÃO
     ===================================================================== -->
<div id="telaApp" class="hidden h-full flex flex-col">

  <header class="app-header no-print sticky top-0 z-30">
    <!-- Uma linha só até o cabeçalho realmente não caber; aí quebra centralizado.
         O que encolhe primeiro são os rótulos dos botões (ver app.css) -->
    <div class="barra-cabecalho max-w-[1600px] mx-auto px-5 py-3 flex flex-wrap justify-center md:justify-between items-center gap-x-4 gap-y-2">

      <div class="flex items-center gap-3 min-w-0">
        <div onclick="SIPAV.app.limparFiltros()" class="flex items-center gap-3 cursor-pointer shrink-0"
             title="Voltar à visão completa, sem filtros">
          <img id="logoSimbolo" alt="" class="shrink-0" style="height:36px;width:auto">
          <div class="leading-tight bloco-marca">
            <img id="logoTexto" alt="SIPAV LT" style="height:16px;width:auto">
            <p class="text-[11px] mt-1" id="nomeObra" style="color:var(--texto-fraco)">
              LT Serra Dourada
            </p>
          </div>
        </div>

        <!-- Seletor de trecho: resolve o "um HTML por trecho" do protótipo -->
        <div class="bloco-trecho ml-2 pl-4 min-w-0" style="border-left:1px solid var(--borda)">
          <label class="rotulo" style="margin-bottom:.25rem">Trecho</label>
          <select id="seletorTrecho" class="campo text-sm font-medium"
                  style="padding:.3125rem .5rem"></select>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-2">

        <button onclick="SIPAV.app.abrirImportacao()" class="btn-header" title="Importar torres colando da planilha">
          <i data-lucide="clipboard-paste" class="w-4 h-4" style="color:var(--acento)"></i>
          <span class="rotulo-btn">Importar</span>
        </button>

        <div class="menu-wrap">
          <button onclick="SIPAV.app.alternarMenu('menuExportar')" class="btn-header" title="Exportar e compartilhar">
            <i data-lucide="share-2" class="w-4 h-4"></i>
            <span class="rotulo-btn">Exportar</span>
            <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
          </button>
          <div id="menuExportar" class="menu hidden">
            <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.abrirRelatorioIsa()">
              <i data-lucide="table-2" class="w-4 h-4 icone-excel"></i> Relatório da ISA
            </button>
            <div class="menu-sep"></div>
            <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.abrirExportarPdf()">
              <i data-lucide="file-text" class="w-4 h-4 icone-pdf"></i> Exportar em PDF
            </button>
            <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.compartilharWhatsApp()">
              <i data-lucide="message-square" class="w-4 h-4 icone-whatsapp"></i> Enviar no WhatsApp
            </button>
          </div>
        </div>

        <div class="menu-wrap">
          <button onclick="SIPAV.app.alternarMenu('menuCadastros')" class="btn-header" title="Atividades e encarregados">
            <i data-lucide="library" class="w-4 h-4"></i>
            <span class="rotulo-btn">Cadastros</span>
            <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
          </button>
          <div id="menuCadastros" class="menu hidden">
            <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.abrirAtividades()">
              <i data-lucide="list-ordered" class="w-4 h-4"></i> Atividades e dependências
            </button>
            <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.abrirEncarregados()">
              <i data-lucide="users" class="w-4 h-4"></i> Encarregados
            </button>
          </div>
        </div>

        <button onclick="SIPAV.app.abrirHistoricoDoTrecho()" class="btn-header" title="Quem mexeu no quê neste trecho">
          <i data-lucide="history" class="w-4 h-4"></i>
          <span class="rotulo-btn">Histórico</span>
        </button>

        <button onclick="SIPAV.app.limparProgramacoesDoPeriodo()" class="btn-header" title="Remover as programações deste trecho no período exibido">
          <i data-lucide="eraser" class="w-4 h-4 icone-perigo"></i>
          <span class="rotulo-btn">Limpar</span>
        </button>

        <div class="flex items-center gap-2 pl-2.5 ml-1" style="border-left:1px solid var(--borda)">
          <span id="indicadorTempoReal"
                class="hidden items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg"
                style="background:rgba(16,185,129,.10);color:#34D399;border:1px solid rgba(16,185,129,.25)"
                title="Alterações de outros usuários aparecem aqui na hora">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="rotulo-vivo">Ao vivo</span>
          </span>

          <div class="bloco-usuario text-right leading-tight">
            <p class="text-xs font-semibold" id="nomeUsuario" style="color:var(--texto)">—</p>
            <p class="text-[10px]" id="papelUsuario" style="color:var(--texto-fraco)">—</p>
          </div>

          <div class="menu-wrap">
            <button onclick="SIPAV.app.alternarMenu('menuConfig')" class="btn-tema" title="Configurações">
              <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
            <div id="menuConfig" class="menu hidden">
              <button class="menu-item" onclick="SIPAV.app.alternarTema()">
                <i data-lucide="sun-moon" class="w-4 h-4"></i> Alternar tema
              </button>
              <div class="menu-sep"></div>
              <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.abrirAlterarSenha()">
                <i data-lucide="key-round" class="w-4 h-4"></i> Alterar minha senha
              </button>
              <button class="menu-item" onclick="SIPAV.app.fecharMenus();SIPAV.app.sair()">
                <i data-lucide="log-out" class="w-4 h-4"></i> Sair
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-5 mt-5 flex-1 w-full pb-12">

    <!-- Abas + filtros -->
    <div class="barra-ferramentas painel p-3 mb-5 flex flex-wrap justify-between items-center gap-4 no-print">

      <div class="flex flex-wrap gap-1">
        <button id="abaGrade"        onclick="SIPAV.app.trocarAba('grade')"        class="aba aba-ativa">
          <i data-lucide="grid-3x3" class="w-4 h-4"></i> Grade Geral
        </button>
        <button id="abaDatas"        onclick="SIPAV.app.trocarAba('datas')"        class="aba">
          <i data-lucide="calendar" class="w-4 h-4"></i> Por Data
        </button>
        <button id="abaEncarregados" onclick="SIPAV.app.trocarAba('encarregados')" class="aba">
          <i data-lucide="user-check" class="w-4 h-4"></i> Por Encarregado
        </button>
        <button id="abaAtividades"   onclick="SIPAV.app.trocarAba('atividades')"   class="aba">
          <i data-lucide="activity" class="w-4 h-4"></i> Por Atividade
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <div class="caixa-filtro">
          <i data-lucide="calendar-range" class="w-3.5 h-3.5" style="color:var(--texto-fraco)"></i>
          <select id="filtroPeriodo" onchange="SIPAV.app.mudarPeriodo(this.value)" class="select-filtro">
            <option value="semana">Esta semana</option>
            <option value="proxima">Próxima semana</option>
            <option value="duas">Esta e a próxima</option>
            <option value="mes">Este mês</option>
            <option value="tudo">Todo o período</option>
            <option value="custom">Personalizado…</option>
          </select>
          <input id="periodoDe"  type="date" onchange="SIPAV.app.mudarPeriodo('custom')"
                 class="hidden select-filtro" title="De">
          <input id="periodoAte" type="date" onchange="SIPAV.app.mudarPeriodo('custom')"
                 class="hidden select-filtro" title="Até">
        </div>

        <div class="caixa-filtro">
          <i data-lucide="columns-3" class="w-3.5 h-3.5" style="color:var(--texto-fraco)"></i>
          <select id="filtroColunas" onchange="SIPAV.app.mudarColunas(this.value)" class="select-filtro">
            <option value="auto">Auto</option>
            <option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="8">8</option>
            <option value="10">10</option><option value="12">12</option>
          </select>
        </div>

        <div class="caixa-filtro">
          <i data-lucide="tent" class="w-3.5 h-3.5" style="color:var(--texto-fraco)"></i>
          <select id="filtroCanteiro" onchange="SIPAV.app.renderizar()" class="select-filtro">
            <option value="">Todos os canteiros</option>
          </select>
        </div>

        <div class="caixa-filtro">
          <i data-lucide="filter" class="w-3.5 h-3.5" style="color:var(--texto-fraco)"></i>
          <select id="filtroAtividade" onchange="SIPAV.app.renderizar()" class="select-filtro">
            <option value="">Todas as atividades</option>
          </select>
        </div>

        <div class="caixa-filtro">
          <i data-lucide="search" class="w-3.5 h-3.5" style="color:var(--texto-fraco)"></i>
          <input id="filtroBusca" oninput="SIPAV.app.renderizar()" placeholder="Buscar torre…"
                 class="text-xs bg-transparent focus:outline-none w-28"
                 style="color:var(--texto)">
        </div>

        <span id="resumoEstatisticas" class="resumo"></span>

        <button id="btnLimparFiltros" onclick="SIPAV.app.limparFiltros()"
                class="btn-header hidden" title="Remover todos os filtros e ver tudo">
          <i data-lucide="filter-x" class="w-4 h-4 icone-perigo"></i>
          <span class="rotulo-btn">Limpar filtros</span>
        </button>
      </div>
    </div>

    <!-- Área exportável -->
    <div id="areaRelatorio">
      <div id="cabecalhoPdf" class="hidden mb-4">
        <h2 id="tituloPdf" class="text-xl font-bold" style="color:var(--texto)"></h2>
        <p id="subtituloPdf" class="text-sm" style="color:var(--texto-suave)"></p>
      </div>

      <div id="visaoGrade"        class="grid gap-2"></div>
      <div id="visaoDatas"        class="hidden space-y-6"></div>
      <div id="visaoEncarregados" class="hidden space-y-5"></div>
      <div id="visaoAtividades"   class="hidden space-y-5"></div>
    </div>

    <div id="estadoVazio" class="hidden text-center py-20">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3" style="color:var(--texto-fraco)"></i>
      <p class="font-medium" style="color:var(--texto-suave)">Nenhuma torre neste trecho</p>
      <p class="text-sm mt-1" style="color:var(--texto-fraco)">
        Use <strong style="color:var(--acento)">Importar</strong> para colar as torres da planilha
      </p>
    </div>
  </main>
</div>

<!-- ========================================================================
     MODAL — PROGRAMAÇÃO DA TORRE
     ===================================================================== -->
<div id="modalProgramacao" class="modal hidden">
  <div class="modal-caixa max-w-2xl">
    <div class="flex justify-between items-start p-5" style="border-bottom:1px solid var(--borda)">
      <div>
        <div class="flex items-center gap-2">
          <h3 class="text-xl font-bold" style="color:var(--texto)">Torre <span id="modalTorreNome"></span></h3>
          <span id="modalTorreRestricao" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 border border-rose-200"></span>
        </div>
        <p class="text-sm mt-0.5" style="color:var(--texto-suave)">
          <span id="modalTorreKm"></span> km ·
          <span id="modalTorreCanteiro"></span>
          <span id="modalTorreTipo"></span>
          Última atividade: <span id="modalTorreUltima" class="font-medium">—</span>
          <button onclick="SIPAV.app.abrirCorrigirEstagio()"
                  class="ml-1 align-middle p-1 rounded hover:bg-slate-100"
                  style="color:var(--texto-fraco)" title="Corrigir o estágio desta torre">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
          </button>
        </p>
      </div>
      <button onclick="SIPAV.app.fecharModal('modalProgramacao')" class="btn-icone shrink-0">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="p-5 space-y-5 max-h-[65vh] overflow-y-auto barra-fina">

      <div>
        <div class="flex items-center justify-between mb-2">
          <h4 class="rotulo" style="margin-bottom:0">Programado</h4>
          <div class="flex items-center gap-2">
            <span id="modalContagem" class="text-xs font-semibold px-2 py-0.5 rounded-full"
                  style="background:var(--superficie-3);color:var(--texto-suave)">0</span>
            <button id="btnLimparTorre" onclick="SIPAV.app.limparProgramacoesDaTorre()"
                    class="hidden text-xs font-semibold text-rose-600 hover:text-rose-700 flex items-center gap-1"
                    title="Remover todas as programações desta torre">
              <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Limpar
            </button>
          </div>
        </div>
        <div id="modalListaProgramacoes" class="space-y-2"></div>
      </div>

      <div class="pt-5" style="border-top:1px solid var(--borda)">
        <div class="flex items-center justify-between mb-3">
          <h4 id="tituloFormulario" class="rotulo" style="margin-bottom:0">Nova atividade</h4>
          <button id="btnCancelarEdicao" onclick="SIPAV.app.cancelarEdicao()"
                  class="hidden text-xs font-semibold flex items-center gap-1"
                  style="color:var(--texto-suave)">
            <i data-lucide="x" class="w-3.5 h-3.5"></i> Cancelar edição
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="rotulo">Atividade</label>
            <select id="campoAtividade" class="campo" onchange="SIPAV.app.mudarAtividade()"></select>
          </div>
          <div>
            <label class="rotulo">Data</label>
            <input id="campoData" type="date" class="campo" onchange="SIPAV.app.verificarBloqueio()">
          </div>
          <div>
            <label class="rotulo">Encarregado</label>
            <select id="campoEncarregado" class="campo" onchange="SIPAV.app.verificarConflito()"></select>
          </div>
          <div>
            <label class="rotulo">Observação (opcional)</label>
            <input id="campoObservacao" class="campo" placeholder="Ex.: equipe reduzida">
          </div>

          <!-- Só aparece nas atividades de cabo-guarda. É o que decide se a
               linha vai para a seção 4.1 ou 4.2 do relatório da ISA. -->
          <div id="blocoCabo" class="hidden sm:col-span-2">
            <label class="rotulo">Cabo</label>
            <select id="campoCabo" class="campo">
              <option value="">Escolha o cabo…</option>
              <option value="OPGW">OPGW</option>
              <option value="PARA_RAIO">Para-raio 3/8 / Dotterel</option>
            </select>
          </div>
        </div>

        <div id="avisoBloqueio" class="hidden mt-3 rounded-lg border border-amber-300 bg-amber-50 p-3">
          <div class="flex gap-2">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
            <div class="flex-1">
              <p class="text-sm font-semibold text-amber-900">Fora da sequência</p>
              <p id="textoBloqueio" class="text-sm text-amber-800 mt-0.5"></p>
              <div id="caixaOverride" class="mt-2.5">
                <label class="flex items-center gap-2 text-sm text-amber-900 cursor-pointer">
                  <input type="checkbox" id="campoOverride" onchange="SIPAV.app.alternarOverride()"
                         class="rounded border-amber-400 text-amber-600 focus:ring-amber-500">
                  Programar mesmo assim
                </label>
                <input id="campoOverrideMotivo" class="hidden campo mt-2"
                       placeholder="Justificativa (fica registrada)">
              </div>
            </div>
          </div>
        </div>

        <div id="avisoConflito" class="hidden mt-3 rounded-lg border border-sky-300 bg-sky-50 p-3">
          <div class="flex gap-2">
            <i data-lucide="users" class="w-4 h-4 text-sky-600 shrink-0 mt-0.5"></i>
            <p id="textoConflito" class="text-sm text-sky-800"></p>
          </div>
        </div>

        <button onclick="SIPAV.app.adicionarProgramacao()" id="btnAdicionar"
                class="btn-primario mt-4 w-full flex items-center justify-center gap-2 disabled:opacity-50">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span id="rotuloBtnAdicionar">Adicionar programação</span>
        </button>
      </div>
    </div>

    <div class="flex justify-between items-center p-4 modal-rodape rounded-b-2xl"
         style="border-top:1px solid var(--borda)">
      <div class="flex items-center gap-4">
        <button onclick="SIPAV.app.abrirRestricao()" class="text-sm text-rose-600 hover:text-rose-700 font-medium flex items-center gap-1.5">
          <i data-lucide="octagon-alert" class="w-4 h-4"></i> Restrições
        </button>
        <button onclick="SIPAV.app.abrirHistoricoDaTorre()" class="text-sm font-medium flex items-center gap-1.5"
                style="color:var(--texto-suave)">
          <i data-lucide="history" class="w-4 h-4"></i> Histórico
        </button>
      </div>
      <button onclick="SIPAV.app.fecharModal('modalProgramacao')" class="btn-secundario">Fechar</button>
    </div>
  </div>
</div>

<!-- ========================================================================
     MODAIS SECUNDÁRIOS
     ===================================================================== -->
<div id="modalGenerico" class="modal hidden">
  <div class="modal-caixa max-w-2xl">
    <div class="flex justify-between items-center p-5" style="border-bottom:1px solid var(--borda)">
      <h3 id="genericoTitulo" class="text-lg font-bold" style="color:var(--texto)"></h3>
      <button onclick="SIPAV.app.fecharModal('modalGenerico')" class="btn-icone shrink-0">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div id="genericoCorpo" class="p-5 max-h-[70vh] overflow-y-auto barra-fina"></div>
    <div id="genericoRodape" class="flex justify-end gap-2 p-4 modal-rodape rounded-b-2xl"
         style="border-top:1px solid var(--borda)"></div>
  </div>
</div>

<div id="modalConfirmacao" class="modal hidden">
  <div class="modal-caixa max-w-sm">
    <div class="p-5">
      <div class="flex gap-3">
        <div class="p-2 bg-rose-100 rounded-xl h-fit">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-600"></i>
        </div>
        <div>
          <h3 id="confirmacaoTitulo" class="font-bold" style="color:var(--texto)"></h3>
          <p id="confirmacaoMensagem" class="text-sm mt-1" style="color:var(--texto-suave)"></p>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-2 p-4 modal-rodape rounded-b-2xl"
         style="border-top:1px solid var(--borda)">
      <button onclick="SIPAV.app.fecharModal('modalConfirmacao')" class="btn-secundario">Cancelar</button>
      <button id="btnConfirmar" class="btn-perigo">Confirmar</button>
    </div>
  </div>
</div>

<!-- Aviso flutuante -->
<div id="aviso" class="fixed bottom-5 right-5 z-[60] hidden">
  <div id="avisoInterno" class="flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg text-sm font-medium">
    <i id="avisoIcone" data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
    <span id="avisoTexto"></span>
  </div>
</div>

<!-- Sobreposição de processamento -->
<div id="processando" class="hidden fixed inset-0 z-[70] items-center justify-center"
     style="background:rgba(0,0,0,.6)">
  <div class="modal-caixa max-w-xs px-6 py-5 flex items-center gap-3" style="flex-direction:row">
    <div class="w-5 h-5 rounded-full animate-spin shrink-0"
         style="border:2px solid var(--borda);border-top-color:var(--acento)"></div>
    <span id="processandoTexto" class="text-sm font-medium" style="color:var(--texto)">Processando…</span>
  </div>
</div>
